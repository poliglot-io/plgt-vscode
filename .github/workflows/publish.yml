name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    environment: vscode-marketplace  # requires manual approval per environment policy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The tag is the single source of truth for the version: stamp package.json
      # from it before packaging. package.json keeps a 0.0.0 placeholder in git, so
      # there is no per-release version-bump commit.
      - name: Stamp version from tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Package (.vsix)
        run: |
          npm run bundle
          npx @vscode/vsce package --pre-release --no-dependencies --out ./poliglot-latest.vsix

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --pre-release --packagePath ./poliglot-latest.vsix --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
