name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    environment: vscode-marketplace  # requires manual approval per environment policy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          REF_TAG="${GITHUB_REF#refs/tags/}"
          if [ -n "${{ inputs.tag }}" ]; then REF_TAG="${{ inputs.tag }}"; fi
          if [ "$PKG_VERSION" != "$REF_TAG" ]; then
            echo "Tag $REF_TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Package (.vsix)
        run: npm run package

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --packagePath ./poliglot-latest.vsix --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
